[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json requires >=22.12.0
  NODE_VERSION = "22"

# The canonical host is www (SITE_URL in src/consts.ts).
[[redirects]]
  from = "https://onesudoku.co/*"
  to = "https://www.onesudoku.co/:splat"
  status = 301
  force = true

# Old @astrojs/sitemap output, still submitted in Search Console.
[[redirects]]
  from = "/sitemap-index.xml"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/sitemap-0.xml"
  to = "/sitemap.xml"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed filenames — safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/puzzles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
