[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json requires >=22.12.0
  NODE_VERSION = "22"

# The canonical host is www (SITE_URL in src/consts.ts).
[[redirects]]
  from = "https://onesudoku.co/*"
  to = "https://www.onesudoku.co/:splat"
  status = 301
  force = true

# Social bio links. Short on purpose; the UTM is added here so GA4 and the
# store-link tagging in Analytics.astro can see where the visit came from.
# A redirect, not a 200 rewrite: both read the UTM from the address bar.
# 302, not 301, so a browser never caches it and the target can change.
[[redirects]]
  from = "/tiktok"
  to = "/?utm_source=tiktok&utm_medium=social&utm_campaign=bio"
  status = 302

[[redirects]]
  from = "/instagram"
  to = "/?utm_source=instagram&utm_medium=social&utm_campaign=bio"
  status = 302

# Old @astrojs/sitemap output, still submitted in Search Console.
[[redirects]]
  from = "/sitemap-index.xml"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/sitemap-0.xml"
  to = "/sitemap.xml"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed filenames — safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/puzzles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
